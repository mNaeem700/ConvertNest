name: ConvertNest Full-Stack CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run code linter checks
      run: npm run lint

    - name: Build frontend and server bundles
      run: npm run build

    - name: Run test suites
      run: |
        echo "Executing full test coverage check..."
        # Add npm test triggers here when test scripts are added to package.json
